<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>आजची संकल्पना · गीता-ज्ञानेश्वरी</title>
<meta name="theme-color" content="#9c4a10" />
<script src="js/sankalpana-list.js"></script>
<script>
  // Same day-index rotation as js/notify.js's todaysSankalpana() — kept in sync
  // deliberately (this page exists so the native Android alarm notification can
  // deep-link to today's actual concept without duplicating this rotation logic
  // in Java, which would go stale as new concepts are added).
  var START_DATE = new Date(2026, 3, 20); // 2026-04-20
  var list = window.SANKALPANA_LIST || [];
  var fallback = 'sankalpana/nishkam-karmayog.html';
  if (list.length) {
    var now = new Date();
    var start = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((today - start) / 86400000);
    var idx = ((days % list.length) + list.length) % list.length;
    window.location.replace('sankalpana/' + list[idx].slug + '.html');
  } else {
    window.location.replace(fallback);
  }
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=sankalpana/nishkam-karmayog.html" />
</noscript>
</head>

  </p>
</body>
